<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Переадресация...</title>
    <meta charset="utf-8">
    <!-- Резервная переадресация -->
    <meta http-equiv="refresh" content="10;url=https://q-acd.github.io/prod/">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        h1 { margin-bottom: 10px; }
        p { color: #555; line-height: 1.6; }
        .timer-wrap { width: 100%; max-width: 500px; margin: 20px auto; }
        meter { width: 100%; height: 30px; }
        .countdown { font-size: 1.2em; font-weight: bold; margin-top: 10px; }
        button { 
            padding: 12px 24px; 
            font-size: 16px; 
            cursor: pointer;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 6px;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #0056b3; }
        .manual-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>
<body onload="startTimer()">

<h1>Автоматическая переадресация...</h1>
<p>Вы будете перенаправлены автоматически. Если этого не произошло, воспользуйтесь ссылками ниже.</p>

<div class="timer-wrap">
    <meter max="2" value="2" min="0" id="time"></meter>
    <div class="countdown" id="counter-text">Осталось: 10 сек.</div>
</div>

<!-- Кнопка остановки -->

<!-- Ссылка, которая изначально скрыта или выглядит как текст -->
<a href="https://q-acd.github.io/prod/" id="manualLink" class="manual-link">Перейти вручную сейчас</a>

<script>
    const timeMeter = document.getElementById('time');
    const counterText = document.getElementById('counter-text');
    const manualLink = document.getElementById('manualLink');
    
    // Общее время: 10 секунд. 
    // В одном секунде 10 интервалов по 100 мс ИЛИ 100 интервалов по 10 мс.
    // Чтобы получить шаг X.X, при интервале setInterval 10мс нам нужно 100 шагов на секунду.
    let totalSteps = 200; // 10 сек * 100 итераций/сек
    let stepsLeft = 200;
    let timerInterval;

    function startTimer() {
        updateDisplay();
        if (timerInterval) clearInterval(timerInterval);
        
        // Интервал срабатывает каждые 10 миллисекунд
        timerInterval = setInterval(function() {
            stepsLeft--;
            
            if (stepsLeft <= 0) {
                clearInterval(timerInterval);
                redirect();
            } else {
                updateDisplay();
            }
        }, 10);
    }

    function updateDisplay() {
        // Преобразуем шаги обратно в секунды с одним знаком после запятой
        const seconds = (stepsLeft / 100).toFixed(1); 
        
        // Значение для шкалы <meter> должно быть целым числом от 0 до max
        timeMeter.value = seconds;
        
        // Текстовый счетчик
        counterText.textContent = 'Осталось: ' + seconds + ' с';
    }

    function redirect() {
        window.location.href = "https://q-acd.github.io/prod/";
    }


</script>

</body>
</html>
